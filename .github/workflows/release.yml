name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
      id-token: write
    outputs:
      updater_signing: ${{ steps.updater-signing.outputs.enabled }}
      version: ${{ steps.version.outputs.value }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            rust-toolchain: stable
            args: --target aarch64-apple-darwin
            rust-target: aarch64-apple-darwin
          - platform: macos-latest
            rust-toolchain: stable
            args: --target x86_64-apple-darwin
            rust-target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            rust-toolchain: stable
            args: ""
            rust-target: ""
          - platform: windows-latest
            rust-toolchain: stable-x86_64-pc-windows-gnu
            args: --target x86_64-pc-windows-gnu
            rust-target: x86_64-pc-windows-gnu

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      # The Windows leg targets x86_64-pc-windows-gnu to match the maintainer's
      # build, so the GNU-specific cdylib fix in src-tauri/build.rs applies to
      # release artifacts too. Rust ships self-contained import libs for this
      # target but no `windres` and no C compiler, both of which Tauri needs (the
      # resource/icon compile and the `ring` crate), so provide a real mingw-w64
      # toolchain and put it on PATH ahead of rustc's linker lookup.
      - name: Install mingw-w64 for the windows-gnu target
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $mingw = @("C:\msys64\mingw64\bin", "C:\mingw64\bin") |
            Where-Object { Test-Path "$_\gcc.exe" } | Select-Object -First 1
          if (-not $mingw) {
            throw "no mingw-w64 toolchain found; expected gcc in C:\msys64\mingw64\bin"
          }
          Write-Host "Using mingw-w64 from $mingw"
          "$mingw" | Out-File $env:GITHUB_PATH -Append
          & "$mingw\gcc.exe" --version
          & "$mingw\windres.exe" --version

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Read release version
        id: version
        shell: bash
        run: echo "value=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust-toolchain }}
          targets: ${{ matrix.rust-target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: ${{ matrix.platform }}-${{ matrix.rust-target }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI sidecar
        env:
          TERAX_CLI_TARGET: ${{ matrix.rust-target }}
        run: pnpm build:cli

      - id: updater-signing
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [[ -n "$TAURI_SIGNING_PRIVATE_KEY" && -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Updater signing secrets are not configured; updater artifacts will be skipped."
          fi

      # Authenticode signing is independent of the updater key. Gating it on
      # updater-signing shipped unsigned Windows installers whenever the updater
      # secrets were absent, and an unsigned NSIS setup is exactly what Defender
      # (Worm:Win32/AutoRun family) and SmartScreen flag.
      - id: windows-signing
        shell: bash
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          if [[ -n "$SIGNPATH_API_TOKEN" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SIGNPATH_API_TOKEN is not configured; Windows installers will ship unsigned."
          fi

      - name: Write Apple API key to disk
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        env:
          KEY_CONTENT: ${{ secrets.APPLE_API_KEY_PATH }}
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s' "$KEY_CONTENT" > "$HOME/private_keys/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$HOME/private_keys/AuthKey.p8" >> "$GITHUB_ENV"

      - id: macos-signing
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [[ -n "$APPLE_CERTIFICATE" && -n "$APPLE_CERTIFICATE_PASSWORD" ]]; then
            CERT_FILE=$(mktemp)
            trap 'rm -f "$CERT_FILE"' EXIT
            printf '%s' "$APPLE_CERTIFICATE" | openssl base64 -d -A > "$CERT_FILE"
            if openssl pkcs12 -info -in "$CERT_FILE" \
              -passin "pass:$APPLE_CERTIFICATE_PASSWORD" -noout >/dev/null 2>&1; then
              echo "enabled=true" >> "$GITHUB_OUTPUT"
            else
              echo "::warning::APPLE_CERTIFICATE is not a valid password-protected PKCS#12 bundle; building an unsigned macOS bundle."
              echo "enabled=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - id: tauri
        if: steps.updater-signing.outputs.enabled == 'true' && (matrix.platform != 'macos-latest' || steps.macos-signing.outputs.enabled == 'true')
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TERAX_CLI_TARGET: ${{ matrix.rust-target }}

          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        with:
          tagName: v${{ steps.version.outputs.value }}
          releaseName: v${{ steps.version.outputs.value }}
          releaseBody: "See the assets to download and install. Auto-update is built in."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - id: tauri-without-updater
        if: steps.updater-signing.outputs.enabled != 'true'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TERAX_CLI_TARGET: ${{ matrix.rust-target }}

          APPLE_SIGNING_IDENTITY: "-"

        with:
          tagName: v${{ steps.version.outputs.value }}
          releaseName: v${{ steps.version.outputs.value }}
          releaseBody: "See the assets to download and install. Auto-update is built in."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }} --config '{"bundle":{"createUpdaterArtifacts":false}}'

      # Portable Windows build: the install layout minus the uninstaller, zipped
      # with forward-slash entries. It gives Windows users an install-free option
      # and skips the NSIS self-extractor path that Defender's heuristic
      # Worm:Win32/AutoRun family trips over. Produced regardless of signing
      # state, so it is always available as the fallback download.
      - name: Package portable Windows zip
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: v${{ steps.version.outputs.value }}
        run: |
          $ErrorActionPreference = "Stop"
          $releaseDir = "src-tauri/target/${{ matrix.rust-target }}/release"
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $stage = "portable"

          New-Item -ItemType Directory -Path "$stage/licenses/terminal" -Force | Out-Null
          foreach ($file in @("terax.exe", "terax-cli.exe", "WebView2Loader.dll")) {
            $source = Join-Path $releaseDir $file
            if (-not (Test-Path $source)) { throw "Missing portable input: $source" }
            Copy-Item $source $stage -Force
          }
          Copy-Item packages/ghostty-core/adapted/LICENSE.ghostty "$stage/licenses/terminal/ghostty.txt"
          Copy-Item packages/ghostty-core/adapted/LICENSE.restty "$stage/licenses/terminal/restty.txt"
          Copy-Item src/modules/terminal/ghostty/webgl/LICENSE.xterm-js "$stage/licenses/terminal/xterm-js.txt"

          # Compress-Archive writes OS separators, which is not the ZIP spec, so
          # build the archive entry by entry with forward slashes.
          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = "Termax_${version}_x64-portable.zip"
          $base = (Get-Item -LiteralPath $stage).FullName
          $separator = [System.IO.Path]::DirectorySeparatorChar
          $slash = [System.IO.Path]::AltDirectorySeparatorChar
          $archive = [System.IO.Compression.ZipFile]::Open($zip, "Create")
          try {
            Get-ChildItem -LiteralPath $base -Recurse -File | ForEach-Object {
              $entry = $_.FullName.Substring($base.Length + 1).Replace($separator, $slash)
              [System.IO.Compression.ZipFileExtensions]::CreateEntryFromFile(
                $archive, $_.FullName, $entry,
                [System.IO.Compression.CompressionLevel]::Optimal) | Out-Null
            }
          } finally { $archive.Dispose() }

          Write-Host "Packaged $zip ($((Get-Item $zip).Length) bytes)"
          gh release upload $env:RELEASE_TAG $zip --clobber --repo $env:GITHUB_REPOSITORY

      # Strip the bundled libwayland-* libs from the AppImage so it loads the
      # host copies at runtime. The Ubuntu 22.04 build host ships libwayland
      # 1.20, but recent Mesa (Fedora 43 / Arch / Bazzite, Mesa 1.22+) needs
      # newer symbols; AppImage puts its bundled libs first on the search path,
      # so the stale copy wins and EGL fails with EGL_BAD_PARAMETER. libgdk-3
      # hard-links these three, so removing them only redirects resolution to
      # the host copy, which every GTK-capable system has. They are on the
      # AppImage excludelist for this exact reason. The re-signed AppImage and
      # its .sig are re-uploaded here; the updater manifest is patched in the
      # patch-appimage-updater job after all matrix legs finish, so a parallel
      # macOS/Windows upload cannot clobber the combined latest.json.
      - name: Fix AppImage wayland libs and re-sign
        if: matrix.platform == 'ubuntu-22.04' && steps.updater-signing.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: v${{ steps.version.outputs.value }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          APPIMAGE=$(ls src-tauri/target/release/bundle/appimage/*.AppImage | head -n1)
          BASENAME=$(basename "$APPIMAGE")
          echo "Patching: $APPIMAGE"

          WORK=$(mktemp -d)
          cp "$APPIMAGE" "$WORK/"
          pushd "$WORK" >/dev/null
          chmod +x "./$BASENAME"
          "./$BASENAME" --appimage-extract >/dev/null

          # Fail loud if Tauri/linuxdeploy stops bundling these, so a future
          # layout change cannot silently ship an unfixed AppImage.
          for lib in libwayland-client.so.0 libwayland-egl.so.1 libwayland-cursor.so.0; do
            test -e "squashfs-root/usr/lib/$lib" \
              || { echo "expected bundled lib missing: $lib (layout changed?)"; exit 1; }
          done

          rm -f squashfs-root/usr/lib/libwayland-client.so.0 \
                squashfs-root/usr/lib/libwayland-egl.so.1 \
                squashfs-root/usr/lib/libwayland-cursor.so.0 \
                squashfs-root/usr/lib/libwayland-server.so.0

          curl -fsSL -o appimagetool.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage
          ARCH=x86_64 ./appimagetool.AppImage --appimage-extract-and-run squashfs-root "$BASENAME"

          # Sanity-check the repacked image before it replaces the original.
          rm -rf squashfs-root
          chmod +x "./$BASENAME"
          "./$BASENAME" --appimage-extract >/dev/null
          for lib in libwayland-client.so.0 libwayland-egl.so.1 libwayland-cursor.so.0; do
            test ! -e "squashfs-root/usr/lib/$lib" \
              || { echo "lib still present after repack: $lib"; exit 1; }
          done
          test -x squashfs-root/usr/bin/terax \
            || { echo "terax binary missing from repacked AppImage"; exit 1; }
          popd >/dev/null

          cp "$WORK/$BASENAME" "$APPIMAGE"

          rm -f "$APPIMAGE.sig"
          pnpm tauri signer sign "$APPIMAGE"

          TAG="$RELEASE_TAG"
          gh release upload "$TAG" "$APPIMAGE" "$APPIMAGE.sig" \
            --clobber --repo "$GITHUB_REPOSITORY"

      # SignPath Authenticode-signs the Windows installers. Their bytes change,
      # so the minisign updater signatures tauri-action produced over the
      # unsigned files no longer match. We stage the installers under the exact
      # names the SignPath artifact configuration expects, submit them, then
      # re-run the tauri signer over the SIGNED files and re-upload both the
      # installers and their new .sig. latest.json is patched in the final
      # patch-updater-manifest job, after every matrix leg has merged, so a
      # parallel macOS/Linux upload cannot clobber the Windows signatures.
      - name: Stage Windows installers for SignPath
        if: matrix.platform == 'windows-latest' && steps.windows-signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # --target x86_64-pc-windows-gnu nests the bundle under the triple.
          $bundleDir = "src-tauri/target/${{ matrix.rust-target }}/release/bundle"
          $exe = Get-ChildItem "$bundleDir/nsis" -Filter *.exe | Select-Object -First 1
          $msi = Get-ChildItem "$bundleDir/msi"  -Filter *.msi | Select-Object -First 1
          if (-not $exe) { throw "No NSIS .exe produced by Tauri" }
          if (-not $msi) { throw "No .msi produced by Tauri" }
          New-Item -ItemType Directory -Path signpath-staging -Force | Out-Null
          Copy-Item $exe.FullName signpath-staging/terax-setup.exe
          Copy-Item $msi.FullName signpath-staging/terax.msi
          "EXE_REAL_PATH=$($exe.FullName)" | Out-File $env:GITHUB_ENV -Append
          "MSI_REAL_PATH=$($msi.FullName)" | Out-File $env:GITHUB_ENV -Append

      - name: Upload unsigned Windows artifact
        id: upload-windows
        if: matrix.platform == 'windows-latest' && steps.windows-signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: windows-unsigned
          path: signpath-staging/
          if-no-files-found: error

      # Requires manual approval in the SignPath UI for the production policy.
      # The default wait timeout is 600s; bumped so the job survives the time
      # it takes to review and approve the request during a release.
      - name: Submit Windows installers to SignPath
        if: matrix.platform == 'windows-latest' && steps.windows-signing.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: 'df665bf4-9b76-41ae-9596-1ba3a23010aa'
          project-slug: 'terax-ai'
          signing-policy-slug: 'release-signing'
          artifact-configuration-slug: 'initial'
          github-artifact-id: ${{ steps.upload-windows.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: 'signed'

      - name: Re-sign updater and upload signed Windows installers
        if: matrix.platform == 'windows-latest' && steps.windows-signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: v${{ steps.version.outputs.value }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          $signedExe = "signed/terax-setup.exe"
          $signedMsi = "signed/terax.msi"
          foreach ($f in @($signedExe, $signedMsi)) {
            if (-not (Test-Path $f)) { throw "Signed artifact missing: $f" }
            $sig = Get-AuthenticodeSignature $f
            if ($null -eq $sig.SignerCertificate) { throw "$f is NOT Authenticode-signed" }
            if ($sig.Status -ne 'Valid') { throw "$f signature status: $($sig.Status)" }
            Write-Host "OK $f -> $($sig.SignerCertificate.Subject)"
          }
          Copy-Item $signedExe $env:EXE_REAL_PATH -Force
          Copy-Item $signedMsi $env:MSI_REAL_PATH -Force
          gh release upload $env:RELEASE_TAG `
            $env:EXE_REAL_PATH $env:MSI_REAL_PATH `
            --clobber --repo $env:GITHUB_REPOSITORY

          # Authenticode changed the installer bytes, so the minisign updater
          # signatures tauri-action produced over the unsigned files no longer
          # match. Regenerate them when the updater key is configured.
          if ($env:TAURI_SIGNING_PRIVATE_KEY) {
            Remove-Item "$($env:EXE_REAL_PATH).sig" -ErrorAction SilentlyContinue
            Remove-Item "$($env:MSI_REAL_PATH).sig" -ErrorAction SilentlyContinue
            pnpm tauri signer sign $env:EXE_REAL_PATH
            pnpm tauri signer sign $env:MSI_REAL_PATH
            gh release upload $env:RELEASE_TAG `
              "$($env:EXE_REAL_PATH).sig" "$($env:MSI_REAL_PATH).sig" `
              --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            Write-Host "Updater signing key absent; leaving updater signatures untouched."
          }

  # Patch the re-signed AppImage and SignPath-signed Windows signatures into the
  # combined updater manifest. Runs once, after every matrix leg has finished
  # merging its platform into latest.json, so it operates on the full manifest
  # and cannot be clobbered by a parallel upload. Both linux keys point at the
  # AppImage; the three windows keys are patched from the minisign signatures
  # regenerated over the Authenticode-signed installers.
  patch-updater-manifest:
    needs: publish-tauri
    if: needs.publish-tauri.outputs.updater_signing == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Patch latest.json with re-signed AppImage and Windows signatures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: v${{ needs.publish-tauri.outputs.version }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"

          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "latest.json" \
            --pattern "*_amd64.AppImage.sig" \
            --pattern "*_x64-setup.exe.sig" \
            --pattern "*_x64_en-US.msi.sig" --clobber

          APP_SIG=$(cat ./*_amd64.AppImage.sig)
          EXE_SIG=$(cat ./*_x64-setup.exe.sig)
          MSI_SIG=$(cat ./*_x64_en-US.msi.sig)

          # Re-signing an artifact re-uploads it with --clobber, which deletes
          # and recreates the asset under a new id. tauri-action baked the old
          # asset-id API urls into latest.json, so we also rewrite the urls of
          # the re-signed artifacts to the tag+filename download url, which is
          # stable across clobbers. Filenames come from the .sig names.
          APP_FILE=$(basename "$(ls ./*_amd64.AppImage.sig)" .sig)
          EXE_FILE=$(basename "$(ls ./*_x64-setup.exe.sig)" .sig)
          MSI_FILE=$(basename "$(ls ./*_x64_en-US.msi.sig)" .sig)
          DL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"

          jq -e 'has("platforms") and (.platforms | has("linux-x86_64")
            and has("windows-x86_64") and has("windows-x86_64-msi")
            and has("windows-x86_64-nsis"))' latest.json >/dev/null \
            || { echo "latest.json missing an expected platform key"; exit 1; }

          # The generic windows-x86_64 key mirrors whichever installer Tauri
          # picked as primary; decode its current signature to see which file it
          # references so the correct regenerated signature and url are used.
          GEN_FILE=$(jq -r '.platforms["windows-x86_64"].signature' latest.json \
            | base64 -d | grep -oE 'file:[^[:space:]]+' | head -n1)
          GEN_FILE=${GEN_FILE#file:}
          case "$GEN_FILE" in
            *.msi) WIN_GEN="$MSI_SIG" ;;
            *)     WIN_GEN="$EXE_SIG" ;;
          esac

          jq --arg app "$APP_SIG" --arg gen "$WIN_GEN" \
             --arg msi "$MSI_SIG" --arg nsis "$EXE_SIG" \
             --arg appurl "$DL/$APP_FILE" --arg genurl "$DL/$GEN_FILE" \
             --arg msiurl "$DL/$MSI_FILE" --arg exeurl "$DL/$EXE_FILE" '
            .platforms["linux-x86_64"] += {signature: $app, url: $appurl}
            | (if .platforms["linux-x86_64-appimage"]
               then .platforms["linux-x86_64-appimage"] += {signature: $app, url: $appurl}
               else . end)
            | .platforms["windows-x86_64"] += {signature: $gen, url: $genurl}
            | .platforms["windows-x86_64-msi"] += {signature: $msi, url: $msiurl}
            | .platforms["windows-x86_64-nsis"] += {signature: $nsis, url: $exeurl}
          ' latest.json > latest.json.tmp
          mv latest.json.tmp latest.json

          gh release upload "$TAG" latest.json --clobber --repo "$GITHUB_REPOSITORY"
